[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "1c2api"
version = "0.1.0"
description = "Генератор OpenAPI из конфигураций 1С"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Bakdaulet Sotsial", email = "smrbruh@example.com"}
]
dependencies = [
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "openapi-spec-validator>=0.7.0",
]

[project.scripts]
1c2api = "parser_1c.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parser_1c*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
