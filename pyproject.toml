[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "1c2api"
version = "0.1.0"
description = "Parse 1C:Enterprise configurations and generate OpenAPI, Postman, Markdown & Swagger UI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bakdaulet Sotsial" }]
requires-python = ">=3.11"
keywords = ["1c", "openapi", "postman", "swagger", "code-generation", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "lxml>=5.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "openapi-spec-validator>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
1c2api = "parser_1c.cli:app"

[project.urls]
Homepage = "https://github.com/bakdaulet/1c2api"
Repository = "https://github.com/bakdaulet/1c2api"
Issues = "https://github.com/bakdaulet/1c2api/issues"

# ---------------------------------------------------------------------------
# Setuptools
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = [
    "parser_1c*",
    "generator_schema*",
    "generator_openapi*",
    "generator_postman*",
    "generator_markdown*",
    "swagger_ui*",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.isort]
known-first-party = [
    "parser_1c",
    "generator_schema",
    "generator_openapi",
    "generator_postman",
    "generator_markdown",
    "swagger_ui",
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
pretty = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = [
    "parser_1c",
    "generator_schema",
    "generator_openapi",
    "generator_postman",
    "generator_markdown",
]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
